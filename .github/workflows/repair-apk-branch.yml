name: One-time APK branch recovery
on:
  push:
    branches:
      - fix/apk-build-repair
    paths:
      - .github/workflows/repair-apk-branch.yml
permissions:
  contents: write
jobs:
  recover-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good sources
        run: |
          git show 1e56bdf:7877o/lib/api.dart > 7877o/lib/api.dart
          git show 1e56bdf:7877o/lib/screens/orders_screen.dart > 7877o/lib/screens/orders_screen.dart
          git show 1e56bdf:7877o/supabase/full_setup.sql > 7877o/supabase/full_setup.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-apk-branch.yml
          git add 7877o/lib/api.dart 7877o/lib/screens/orders_screen.dart 7877o/supabase/full_setup.sql
          git commit -m "Restore pre-corruption Dart sources and secured SQL setup"
          git push origin HEAD:fix/apk-build-repair
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: 7877o
        run: flutter pub get
      - name: Analyze
        working-directory: 7877o
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: 7877o
        run: flutter test
      - name: Build APK
        working-directory: 7877o
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: graphen-bags-android-apk
          path: 7877o/build/app/outputs/flutter-apk/*.apk
