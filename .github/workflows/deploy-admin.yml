# Deploy the admin site from the 7877o directory to GitHub Pages
name: Deploy admin site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "7877o/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload admin site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "7877o"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
