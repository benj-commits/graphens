name: Flutter Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: 7877o
        run: flutter pub get

      - name: Analyze
        working-directory: 7877o
        run: flutter analyze

      - name: Run tests
        working-directory: 7877o
        run: flutter test

      - name: Build release APK
        working-directory: 7877o
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: graphen-bags-android-apk
          path: 7877o/build/app/outputs/flutter-apk/*.apk
